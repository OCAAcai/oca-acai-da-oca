
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração | OCA Açaí da Oca</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1f8;font-family:Arial,sans-serif;color:#30223b}
header{background:#542477;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0}
main{max-width:950px;margin:25px auto;padding:0 15px}
.card,.order{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 12px #0000000c}
input,button,select{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #ddd;font-size:15px}
button{background:#642d89;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#eee;color:#333}
.hidden{display:none}
.order h3{margin-top:0;color:#642d89}
.order p{margin:8px 0;overflow-wrap:anywhere}
.order pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f5fa;padding:12px;border-radius:8px;font-size:13px}
.status{font-weight:bold;color:#642d89}
#message{padding:10px;color:#a32626}
.top{display:flex;gap:10px;flex-wrap:wrap}
.top button{flex:1;min-width:130px}
small{color:#666}
</style>
</head>
<body>

<header>
<h1>OCA – Açaí da Oca 💜</h1>
<p>Painel Administrativo</p>
</header>

<main>
<section id="login" class="card">
<h2>Entrar na administração</h2>
<form id="loginForm">
<label>E-mail</label>
<input id="email" type="email" required placeholder="Seu e-mail">
<label>Senha</label>
<input id="password" type="password" required placeholder="Sua senha">
<button type="submit" id="loginButton">Entrar</button>
</form>
<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Pedidos da loja</h2>
<div class="top">
<button id="refresh">Atualizar pedidos</button>
<button id="logout" class="secondary">Sair</button>
</div>
<p id="count">Carregando...</p>
</div>
<div id="orders"></div>
</section>
</main>

<script>
const SUPABASE_URL='https://owjmmahyhadevqtjabuq.supabase.co';
const SUPABASE_KEY='sb_publishable_aMBC_I8d5QqsIw9uFwX_pA_kfGVyyL2';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const statuses=[
'Pedido recebido',
'Pedido confirmado',
'Em preparação',
'Saiu para entrega',
'Entregue'
];

const login=document.getElementById('login');
const dashboard=document.getElementById('dashboard');
const message=document.getElementById('message');
const ordersArea=document.getElementById('orders');

function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function money(value){
 return Number(value||0).toLocaleString('pt-BR',{
 style:'currency',currency:'BRL'
 });
}

async function verifyAdmin(){
 const {data,error}=await supabaseClient.rpc('is_store_admin');
 if(error||data!==true){
  await supabaseClient.auth.signOut();
  throw new Error('Este usuário não tem permissão de administrador.');
 }
 login.classList.add('hidden');
 dashboard.classList.remove('hidden');
 await loadOrders();
}

async function loadOrders(){
 ordersArea.innerHTML='<div class="card">Carregando pedidos...</div>';
 const {data,error}=await supabaseClient
  .from('orders')
  .select('*')
  .order('created_at',{ascending:false});

 if(error){
  ordersArea.innerHTML='<div class="card">Erro ao carregar pedidos: '+escapeHTML(error.message)+'</div>';
  return;
 }

 document.getElementById('count').textContent=
  data.length+' pedido(s) encontrado(s).';

 if(!data.length){
  ordersArea.innerHTML='<div class="card">Nenhum pedido registrado ainda.</div>';
  return;
 }

 ordersArea.innerHTML=data.map(order=>{
  const date=order.created_at?
   new Date(order.created_at).toLocaleString('pt-BR'):'';

  const items=typeof order.items==='string'?
   order.items:JSON.stringify(order.items,null,2);

  return `
  <article class="order">
   <h3>Pedido ${escapeHTML(order.id.slice(0,8).toUpperCase())}</h3>
   <p><small>${escapeHTML(date)}</small></p>
   <p><strong>Cliente:</strong> ${escapeHTML(order.customer_name)}</p>
   <p><strong>Telefone:</strong> ${escapeHTML(order.phone)}</p>
   <p><strong>Endereço:</strong> ${escapeHTML(order.address)}</p>
   <p><strong>Localidade:</strong> ${escapeHTML(order.delivery_area)}</p>
   <p><strong>Pagamento:</strong> ${escapeHTML(order.payment_method)}</p>
   <p><strong>Produtos do pedido:</strong></p>
   <pre>${escapeHTML(items)}</pre>
   <p><strong>Observações:</strong> ${escapeHTML(order.notes||'Nenhuma')}</p>
   <p>Subtotal: ${money(order.subtotal)}</p>
   <p>Entrega: ${money(order.delivery_fee)}</p>
   <p><strong>Total: ${money(order.total)}</strong></p>
   <p class="status">Status atual: ${escapeHTML(order.status)}</p>
   <label>Atualizar status:</label>
   <select class="statusSelect" data-id="${escapeHTML(order.id)}">
    ${statuses.map(s=>`<option value="${escapeHTML(s)}" ${s===order.status?'selected':''}>${escapeHTML(s)}</option>`).join('')}
   </select>
   <button class="saveStatus" data-id="${escapeHTML(order.id)}">Salvar status</button>
  </article>`;
 }).join('');

 document.querySelectorAll('.saveStatus').forEach(button=>{
  button.addEventListener('click',()=>updateStatus(button.dataset.id));
 });
}

async function updateStatus(id){
 const select=document.querySelector(`.statusSelect[data-id="${CSS.escape(id)}"]`);
 const newStatus=select.value;

 const {error}=await supabaseClient
  .from('orders')
  .update({status:newStatus})
  .eq('id',id);

 if(error){
  alert('Não foi possível atualizar: '+error.message);
  return;
 }

 alert('Status atualizado com sucesso!');
 await loadOrders();
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('loginButton');
 button.disabled=true;
 button.textContent='Entrando...';
 message.textContent='';

 try{
  const {error}=await supabaseClient.auth.signInWithPassword({
   email:document.getElementById('email').value.trim(),
   password:document.getElementById('password').value
  });
  if(error) throw error;
  await verifyAdmin();
 }catch(error){
  message.textContent=error.message;
 }finally{
  button.disabled=false;
  button.textContent='Entrar';
 }
});

document.getElementById('refresh').addEventListener('click',loadOrders);

document.getElementById('logout').addEventListener('click',async()=>{
 await supabaseClient.auth.signOut();
 dashboard.classList.add('hidden');
 login.classList.remove('hidden');
 document.getElementById('password').value='';
});

supabaseClient.auth.getSession().then(async({data})=>{
 if(data.session){
  try{await verifyAdmin();}
  catch(error){message.textContent=error.message;}
 }
});
</script>
</body>
  </html>
